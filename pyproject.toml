[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zentromart-voiceops"
version = "0.1.0"
description = "Grounded customer support voice agent capstone"
requires-python = ">=3.10"
dependencies = ["gnani-vachana>=0.8.1,<0.9"]

[project.scripts]
zentromart-voice = "zentromart.voice_batch:main"

[tool.setuptools.packages.find]
where = ["src"]
